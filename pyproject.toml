[project]
name = "scifact"
version = "0.0.0"
description = "Evidence retrieval and grounded verdicts over the SciFact corpus"
readme = "README.md"
# 3.12 only. Declaring ">=3.11" would be an unverified claim: nothing in this project
# has ever run on 3.11, and CI does not test it. Widen this when something actually
# exercises the older version.
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

# Dependencies are added when a stage needs them, not upfront.
# Stage 0 and the download script are stdlib-only by design: the first thing that runs
# in this repo should not be able to fail because of a dependency resolution problem.

[project.scripts]
scifact = "scifact.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scifact"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib, not os.path — matters for Windows/Linux portability
    "S",        # flake8-bandit — Stage 6 injects hostile input; start the habit early
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# `assert` is the whole point of a test file; S101 is noise here.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

# torch and transformers ship incomplete type stubs, so `--strict` flags every call into them
# as "untyped call in typed context". Relaxing four rules for the two torch-facing scripts
# keeps strict checking everywhere it can still catch something. The alternative -- scattering
# `# type: ignore` until the noise stops -- suppresses real errors along with the noise.
# src/ stays fully strict, including src/scifact/verify/crossencoder.py.
[[tool.mypy.overrides]]
module = ["train_crossencoder", "eval_stage3", "compare_models", "run_stage3b", "run_dense"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_data: requires the SciFact corpus to be downloaded (skipped in CI)",
]

# --- Stage 3: cross-encoder fine-tuning -------------------------------------
# CUDA 12.6 build (switched from CPU on 2026-09-26 once repeated training runs made it pay).
# Driver 546.80 officially supports CUDA 12.3; cu126 runs under CUDA minor-version
# compatibility -- verified, not assumed: torch.cuda.is_available() is True and training
# runs at 0.44 s/step vs 5.4 s/step on CPU. cu130 is NOT an option on this driver
# (needs a CUDA 13 driver). CI runners have no GPU and fall back to CPU automatically.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
