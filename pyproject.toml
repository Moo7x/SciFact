[project]
name = "scifact"
version = "0.0.0"
description = "Evidence retrieval and grounded verdicts over the SciFact corpus"
readme = "README.md"
# 3.12 only. Declaring ">=3.11" would be an unverified claim: nothing in this project
# has ever run on 3.11, and CI does not test it. Widen this when something actually
# exercises the older version.
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

# Dependencies are added when a stage needs them, not upfront.
# Stage 0 and the download script are stdlib-only by design: the first thing that runs
# in this repo should not be able to fail because of a dependency resolution problem.

[project.scripts]
scifact = "scifact.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scifact"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib, not os.path — matters for Windows/Linux portability
    "S",        # flake8-bandit — Stage 6 injects hostile input; start the habit early
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# `assert` is the whole point of a test file; S101 is noise here.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_data: requires the SciFact corpus to be downloaded (skipped in CI)",
]

# --- Stage 3: cross-encoder fine-tuning -------------------------------------
# CPU-only torch. The CUDA wheel is ~2.5 GB against 27 GB free, and nothing before
# Stage 3 has a GPU consumer. Switch the index to cu124 when GPU training is wanted.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
